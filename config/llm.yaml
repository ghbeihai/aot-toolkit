# AoT v0.1 —— LLM 打分协议（复用 SPI 已验证的 DeepSeek 双轮平均方案）
llm:
  provider: deepseek
  base_url: https://api.deepseek.com
  model: deepseek-chat
  rounds: 2
  temperatures: [0.3, 0.7]
  timeout_seconds: 90
  max_retries: 5          # 429/5xx/超时/截断/JSON 失败的指数退避重试次数
  backoff_base: 2.0       # 首次重试等待秒数，之后翻倍（带抖动）
  backoff_max: 60
  concurrency: 8          # 原 12 易触发 429
  max_text_chars: 6000    # 超长截断，结果带 truncated 标记
  # key：DEEPSEEK_API_KEY 环境变量 → $WENBI_ENV_FILE → 本仓 .env → $SPI_ROOT/$WFP_ROOT .env（scripts/llm_common.py）
  note: 与 SPI 六件套共用同一模型家族，保证人格侧/思维侧画像可直接对齐
