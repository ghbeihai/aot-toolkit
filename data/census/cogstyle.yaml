  - name: 认知风格分析 CSA（整体-分析 / 言语-表象）
    author: Riding & Cheema
    year: 1991
    source: Riding & Cheema (1991) Cognitive Styles—An Overview and Integration. Educational Psychology 11(3-4):193-215
    url: ""
    verified: verified
  - name: 认知风格清单 CoSI（knowing/planning/creating）
    author: Cools & Van den Broeck
    year: 2007
    source: Cools & Van den Broeck (2007) Hunt's conceptual styles and personality traits
    url: ""
