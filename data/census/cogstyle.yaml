# =============================================================================
# AoT 思维构念普查 · F1 认知风格家族
# 编码方式：对齐 SPI 因子链五层（factor / adjectives / synonyms / verbs / nouns）
# 词元为可直接嵌入的中文词项；lexicon_grade: A=现成资产(量表题面/LIWC词类) B=LLM自举
# 文献出处复用 Unit9_Atlas_of_Thinking_综合调研.md 与总报告，不重新全网检索
# =============================================================================

